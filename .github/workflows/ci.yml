name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps for GUI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk || true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crypto tests
        run: python test_crypto.py

      - name: Compile check
        run: python -m compileall app.py crypto.py build_exe.py

      - name: GUI smoke tests
        run: xvfb-run -a python test_gui_smoke.py
