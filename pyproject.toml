[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CryptoNote"
version = "1.0.0"
description = "Encrypted note-taking application with rich text support and hyperlinks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "your.email@example.com"}]
keywords = ["encryption", "notes", "security", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["cryptography>=41.0.0"]

[project.urls]
Homepage = "https://github.com/yourusername/CryptoNote"
Repository = "https://github.com/yourusername/CryptoNote.git"

[project.scripts]
cryptonote = "app:main"

[tool.setuptools]
packages = [""]

[tool.setuptools.package-data]
CryptoNote = ["*.py"]
